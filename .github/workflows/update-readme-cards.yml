name: Refresh profile contributions

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate contribution repository links
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/update-contributions.mjs

      - name: Commit updated profile activity
        run: |
          git add README.md

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contributed repositories"
          git push
